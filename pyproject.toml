[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsr"
version = "0.1.0"
description = "DanceSport Results Intelligence"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
