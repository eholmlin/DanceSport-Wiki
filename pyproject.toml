[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsr"
version = "0.1.0"
description = "DanceSport Results Intelligence"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "click>=8.1",
    "alembic>=1.13",
    "jellyfish>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
app = [
    "streamlit>=1.35",
    "pandas>=2.0",
    "reportlab>=4.0",
    "altair>=5.0",
    "matplotlib>=3.8",
]
postgres = [
    "psycopg2-binary>=2.9",
    # Both drivers, not just one: SQLAlchemy picks the driver from the URL's
    # scheme (plain postgresql:// -> psycopg2, postgresql+psycopg:// ->
    # psycopg v3), and the deployed DSR_DATABASE_URL secret named v3 while
    # only v2 was installed -- the whole app crashed on startup with
    # "ModuleNotFoundError: No module named 'psycopg'" the first time
    # Streamlit Cloud rebuilt its environment.
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
