[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsr"
version = "0.1.0"
description = "DanceSport Results Intelligence"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    # Capped below 2.1: SQLAlchemy 2.1 (needs Python 3.11+) changed the
    # default driver for a plain postgresql:// URL from psycopg2 to psycopg
    # v3. Streamlit Cloud's Python 3.14 rebuild picked up 2.1.x from this
    # unpinned range and the app crashed at startup with "No module named
    # 'psycopg'" -- the local venv is Python 3.9, which can't even see 2.1,
    # so nothing here had ever run on it. Production should run the version
    # it's actually tested on.
    "sqlalchemy>=2.0,<2.1",
    "click>=8.1",
    "alembic>=1.13",
    "jellyfish>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
app = [
    "streamlit>=1.35",
    # pandas 3 and altair 6 (both Python 3.11+, so invisible to the local
    # Python 3.9 venv) are major jumps the app has never run on; same
    # reason as the SQLAlchemy cap above.
    "pandas>=2.0,<3",
    "reportlab>=4.0",
    "altair>=5.0,<6",
    "matplotlib>=3.8",
]
postgres = [
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
